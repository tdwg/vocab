name: Deploy SDS and VMS documents to webserver

on:
  # Runs on pushes targeting the master branch
  push:
    branches:
      - 'master'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "deploy-pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 2 # Increment this number if you need to re-download cached gems

      - name: Build SDS with Jekyll
        run: bundle exec jekyll build --baseurl / --source ./sds --destination ./_sds_site
        env:
          JEKYLL_ENV: production

      - name: Build VMS with Jekyll
        run: bundle exec jekyll build --baseurl / --source ./vms --destination ./_vms_site
        env:
          JEKYLL_ENV: production

      - name: Deploy sites to https://sds.tdwg.org and https://vms.tdwg.org
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rv --delete --checksum ./_sds_site/ sds-vms@tdwgstatic-vh.tdwg.org:/sds.tdwg.org/
          rsync -rv --delete --checksum ./_vms_site/ sds-vms@tdwgstatic-vh.tdwg.org:/vms.tdwg.org/
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{secrets.SDS_VMS_TDWG_ORG}}
          SSH_KNOWN_HOSTS: ${{vars.SSH_KNOWN_HOSTS}}
